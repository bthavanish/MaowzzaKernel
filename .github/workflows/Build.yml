name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/galaxym12development/android_kernel_samsung_exynos850
          kernel-branch: android-14.0
          depth: 1
          config: a12s_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          android-version: 12
          aosp-clang-version: r416183b
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/rsuntk/KernelSU
          ksu-version: main
          disable-lto: true
          anykernel3: false
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
